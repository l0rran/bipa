name: bipa
description: >-
  Bipa: controle de estoque da casa e histórico de preços de mercado,
  100% offline, com leitura de código de barras e de etiquetas pela câmera.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  # AGP 9 e o Kotlin embutido pedem o Flutter 3.47 (ver docs/contribuindo.md).
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Banco de dados local (SQLite) com consultas tipadas e streams reativas.
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  # Estado e injeção de dependências.
  flutter_riverpod: ^3.0.0
  # Localização do aparelho (funciona offline via GPS).
  geolocator: ^14.0.0
  # Navegação declarativa.
  go_router: ^16.0.0
  # Reconhecimento on-device (offline) de texto e código de barras.
  google_mlkit_barcode_scanning: ^0.14.1
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  meta: ^1.15.0
  # Leitura de código de barras em tempo real pela câmera.
  mobile_scanner: ^7.0.0
  # Pasta de documentos do app, onde ficam as fotos dos produtos.
  path_provider: ^2.1.6
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Gera AppLocalizations a partir de lib/core/l10n/*.arb (ver l10n.yaml).
  generate: true

  assets:
    # Licenças das fontes (SIL Open Font License), exibidas na tela de licenças.
    - assets/fonts/OFL-Manrope.txt
    - assets/fonts/OFL-Figtree.txt
    - assets/fonts/OFL-JetBrainsMono.txt

  # Fontes do design system, em arquivos estáticos por peso (o app é offline).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
