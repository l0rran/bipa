include: package:flutter_lints/flutter.yaml

# O código usa linhas de até 120 colunas; o dart format respeita este valor.
formatter:
  page_width: 120

analyzer:
  exclude:
    - "**/*.g.dart"
    # Gerados pelo drift_dev a partir de drift_schemas/ (docs/contribuindo.md).
    - test/core/database/schemas/**
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_named_constants
