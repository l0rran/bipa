<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Início: editor da linha</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/bipa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&amp;family=Figtree:wght@400..700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B22}a:hover{color:#B00E28}
.screen{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--ground)}
.round-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface);color:var(--ink)}
.nav-wrap{position:absolute;left:12px;right:12px;bottom:16px;z-index:3}
.section{display:flex;flex-direction:column;gap:8px}

.content{display:flex;flex-direction:column;gap:20px;padding:24px 16px 150px}
/* O editor como o app o monta (StockRowEditor): o stepper e, quando não cabe ao lado,
   a lista, o chip "Ter sempre" e o "⋯" na linha de baixo. */
.bipa-shelf__editor > div{flex-wrap:wrap;justify-content:flex-start;row-gap:8px}
.trail{display:flex;align-items:center;gap:0}
.icon-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--ink)}
.icon-btn svg{width:24px;height:24px}
/* DropdownChip do app: o chip do design system com a seta. */
.bipa-chip svg{width:18px;height:18px}
.bipa-chip .down{width:16px;height:16px}
.trail .bipa-chip{font:700 14px/18px var(--font-body)}
</style>
</helmet>
<div class="screen bipa-root">
  <div class="content">
    <section class="section">
      <div class="bipa-section-head"><h2>Em casa</h2><span class="bipa-count">24</span><a class="bipa-more" href="#">Ver tudo</a></div>
      <div class="bipa-shelf">
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false"><span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M11 3v3"/></svg></span><span class="bipa-shelf__name">Café Pilão tradicional 500&nbsp;g</span><span class="bipa-gauge" style="--p: 100" role="img" aria-label="1 embalagem, ter sempre 1"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">1</span></span></button>
        </div>
        <div class="bipa-shelf__item is-low is-open">
          <button class="bipa-shelf__row" type="button" aria-expanded="true"><span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v3l2 3v12H6V9l2-3z"/><path d="M6 9h12"/></svg></span><span class="bipa-shelf__name">Leite integral 1&nbsp;L</span><span class="bipa-gauge is-low" style="--p: 33" role="img" aria-label="1 de 3 embalagens"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">1</span></span></button>
          <div class="bipa-shelf__editor"><div>
            <div class="bipa-stepper is-low">
              <button type="button" data-step="-1" aria-label="Uma embalagem a menos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
              <span class="bipa-stepper__count" aria-label="1 embalagem em casa"><span class="bipa-roll bipa-stepper__qty"><span>1</span></span><span class="bipa-stepper__unit">emb.</span></span>
              <button type="button" data-step="1" aria-label="Uma embalagem a mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            </div>
            <div class="trail">
              <button class="icon-btn" type="button" aria-label="Pôr na lista" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h11M4 12h11M4 17.5h7M17 15v6M14 18h6"/></svg></button>
              <button class="bipa-chip" type="button" aria-label="Ter sempre 3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Ter sempre 3<svg class="down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
              <button class="icon-btn" type="button" aria-label="Mais do item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg></button>
            </div>
          </div></div>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false"><span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M8.5 8.5c.6-1.2 2-1.2 2.6 0M13 7.5c.6-1.2 2-1.2 2.6 0"/></svg></span><span class="bipa-shelf__name">Feijão carioca Kicaldo 1&nbsp;kg</span><span class="bipa-gauge" style="--p: 100" role="img" aria-label="3 embalagens, ter sempre 2"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">3</span></span></button>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false"><span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="7" width="14" height="14" rx="2.5"/><path d="M9 7V4h6v3M9 12h6"/></svg></span><span class="bipa-shelf__name">Sabão em pó Omo 1,6&nbsp;kg</span><span class="bipa-gauge" style="--p: 100" role="img" aria-label="2 embalagens, ter sempre 1"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">2</span></span></button>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false"><span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h10v15a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/><path d="M7 9h10"/></svg></span><span class="bipa-shelf__name">Leite condensado Moça 395&nbsp;g</span><span class="bipa-gauge" style="--p: 100" role="img" aria-label="5 embalagens, ter sempre 2"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">5</span></span></button>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false"><span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M8.5 8.5c.6-1.2 2-1.2 2.6 0M13 7.5c.6-1.2 2-1.2 2.6 0"/></svg></span><span class="bipa-shelf__name">Arroz Tio João 5&nbsp;kg</span><span class="bipa-gauge" style="--p: 100" role="img" aria-label="2 embalagens, ter sempre 1"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">2</span></span></button>
        </div>
      </div>
    </section>
  </div>
  <div class="nav-wrap">
    <nav class="bipa-nav bipa-nav--glass" aria-label="Navegação principal">
      <span class="bipa-nav__indicator" aria-hidden="true" style="width: 52px; transform: translateX(15px);"></span>
      <a class="bipa-nav__dest" href="Main.dc.html" aria-current="page" style="text-decoration: none;"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5v8.5H4z"/><path d="M10 19.5v-5h4v5"/></svg></span><span class="bipa-nav__label">Início</span></a>
      <a class="bipa-nav__dest" href="Produtos.dc.html" style="text-decoration: none;"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.5H20v7.4L11 20 3.9 12.9z"/><circle cx="16" cy="7.8" r="1.4"/></svg></span><span class="bipa-nav__label">Produtos</span></a>
      <a class="bipa-scan" href="Captura.dc.html" aria-label="Bipar (segure para mais opções)"><span class="bipa-scan__icon"><span class="bipa-scan__glyph" style="display: grid;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18"/></svg></span></span></a>
      <a class="bipa-nav__dest" href="Mercados.dc.html" style="text-decoration: none;"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span><span class="bipa-nav__label">Mercados</span></a>
      <a class="bipa-nav__dest" href="Lista.dc.html" style="text-decoration: none;"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1"/><circle cx="4.8" cy="12" r="1"/><circle cx="4.8" cy="17.5" r="1"/></svg></span><span class="bipa-nav__label">Lista</span></a>
    </nav>
  </div>
</div>
