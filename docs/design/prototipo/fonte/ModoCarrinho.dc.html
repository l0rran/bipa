<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modo carrinho</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/bipa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&amp;family=Figtree:wght@400..700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B22}a:hover{color:#B00E28}
.screen{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--camera)}
.title{margin:0;font:800 28px/34px var(--font-display);letter-spacing:-0.01em;color:var(--ink)}
.eyebrow{font:600 14px/20px var(--font-body);color:var(--ink-muted)}
.section-title{margin:0;font:700 20px/26px var(--font-display);color:var(--ink)}
.round-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface);color:var(--ink)}
.nav-wrap{position:absolute;left:12px;right:12px;bottom:16px;z-index:3}

.cam{position:absolute;inset:0;background:var(--camera);overflow:hidden}
.shelf{position:absolute;left:-10px;right:-10px;top:150px;display:grid;grid-template-rows:150px 10px 150px;gap:16px;opacity:.55}
.shelf div{display:flex;gap:10px}
.shelf i{display:block;flex:none;border-radius:14px;background:#2B2B33}
.shelf hr{margin:0;border:0;background:#35353F}
.topbar{position:absolute;left:16px;right:16px;top:20px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
.glass-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:rgba(14,14,18,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--on-camera);text-decoration:none}
.tag{position:absolute;display:grid;gap:4px;padding:12px 16px 12px 30px;border-radius:8px 14px 14px 8px;background:var(--price);color:var(--on-price);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tag::before{content:"";position:absolute;left:11px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#2B2B33}
.tag b{font:800 11px/14px var(--font-body);letter-spacing:.04em}
.tag strong{font:800 38px/40px var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tag strong small{font-size:19px;margin-right:2px}
.tag span{font:600 11px/14px var(--font-body)}
.frame-wrap{position:absolute;left:0;right:0;top:0;bottom:0}
.seg-wrap{position:absolute;left:0;right:0;bottom:150px;display:flex;justify-content:center;z-index:3}
.bottombar{position:absolute;left:24px;right:24px;bottom:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;z-index:3}
.shutter{justify-self:center;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:var(--brand);color:var(--on-brand);box-shadow:0 0 0 6px rgba(246,196,69,.28);text-decoration:none}
.shutter svg{width:34px;height:34px}

.tray-wrap{position:absolute;left:0;right:0;bottom:0;z-index:3}
.tray-foot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;padding:4px 4px 0}
.tray-foot .shutter{width:68px;height:68px}

</style>
</helmet>
<div class="screen bipa-root" style="background: var(--camera);">
  <div class="cam" aria-hidden="true"><div class="shelf"><div><i style="width: 110px"></i><i style="width: 90px"></i><i style="width: 140px"></i><i style="width: 80px"></i></div><hr><div><i style="width: 140px"></i><i style="width: 100px"></i><i style="width: 120px"></i></div></div></div>
  <div class="tag" style="left: 100px; top: 214px; transform: rotate(-1.5deg);" aria-hidden="true">
    <b>ARROZ TIO JOAO 5KG</b><strong><small>R$</small>27,90</strong><span>R$ 5,58/kg</span>
  </div>
  <div class="frame-wrap"><div class="bipa-frame is-locked" style="left: 84px; top: 196px; width: 222px; height: 124px; transform: none;"><span class="bipa-frame__corner bipa-frame__corner--tl"></span><span class="bipa-frame__corner bipa-frame__corner--tr"></span><span class="bipa-frame__corner bipa-frame__corner--bl"></span><span class="bipa-frame__corner bipa-frame__corner--br"></span><span class="bipa-frame__laser"></span></div></div>
  <div class="topbar">
    <a class="glass-btn" href="CasaCompra.dc.html" aria-label="Fechar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <a class="bipa-chip bipa-chip--glass" href="Mercados.dc.html" style="text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5v10h16v-10M9.5 19.5v-5h5v5"/></svg>Atacarejo Vila Nova <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
    <button class="glass-btn" type="button" aria-label="Lanterna"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1.5 6h-5zM9.5 9l1 12h3l1-12"/></svg></button>
  </div>
  <div class="tray-wrap">
    <section class="bipa-tray" aria-label="Carrinho">
      <span class="bipa-tray__handle" aria-hidden="true"></span>
      <div class="bipa-tray__head">
        <div><div class="bipa-tray__title">Carrinho</div><div class="bipa-tray__count"><span class="bipa-roll"><span>4</span></span> de 7 da lista</div></div>
        <div class="bipa-tray__total"><span class="bipa-tray__total-label">Vou levar</span><span class="bipa-tray__total-value">R$ 54,88</span></div>
      </div>
      <div class="bipa-tray__list">
        <div class="bipa-tray__item is-new" data-cents="2790"><span class="bipa-tray__item-name">Arroz Tio João 5 kg</span><span class="bipa-tray__item-price">R$ 27,90</span><button type="button" class="bipa-toggle" role="switch" aria-checked="true" aria-label="Levar Arroz Tio João 5 kg"></button></div>
        <div class="bipa-tray__item" data-cents="799"><span class="bipa-tray__item-name">Leite condensado Moça 395 g</span><span class="bipa-tray__item-price">R$ 7,99</span><button type="button" class="bipa-toggle" role="switch" aria-checked="true" aria-label="Levar Leite condensado Moça 395 g"></button></div>
        <div class="bipa-tray__item" data-cents="1899"><span class="bipa-tray__item-name">Café Pilão 500 g</span><span class="bipa-tray__item-price">R$ 18,99</span><button type="button" class="bipa-toggle" role="switch" aria-checked="true" aria-label="Levar Café Pilão 500 g"></button></div>
        <div class="bipa-tray__item is-skipped" data-cents="2490"><span class="bipa-tray__item-name">Sabão em pó Omo 1,6 kg</span><span class="bipa-tray__item-price">R$ 24,90</span><button type="button" class="bipa-toggle" role="switch" aria-checked="false" aria-label="Levar Sabão em pó Omo 1,6 kg"></button></div>
      </div>
      <div class="tray-foot">
        <button class="glass-btn" type="button" aria-label="Digitar o preço" style="background: var(--surface-sunken); color: var(--ink);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg></button>
        <a class="shutter" href="Confirmacao.dc.html" aria-label="Bipar"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18"/></svg></a>
        <a class="bipa-btn bipa-btn--neutral" href="Main.dc.html" style="justify-self: end; height: 48px; padding: 0 18px; text-decoration: none;"><span>Terminei</span></a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
