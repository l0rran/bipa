<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arrumar o que entrou</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/bipa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&amp;family=Figtree:wght@400..700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B22}a:hover{color:#B00E28}
.screen{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--camera)}

.cam{position:absolute;inset:0;background:var(--camera);overflow:hidden}
.shelf{position:absolute;left:-10px;right:-10px;top:150px;display:grid;grid-template-rows:150px 10px 150px;gap:16px;opacity:.55}
.shelf div{display:flex;gap:10px}
.shelf i{display:block;flex:none;border-radius:14px;background:#2B2B33}
.shelf hr{margin:0;border:0;background:#35353F}
.topbar{position:absolute;left:16px;right:16px;top:20px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
.glass-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:rgba(14,14,18,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--on-camera);text-decoration:none}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:2}
.sheet{position:absolute;left:0;right:0;bottom:0;top:72px;z-index:4;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--surface);box-shadow:var(--shadow-float);animation:bipa-in-up var(--duration-slow) var(--easing-spring) both;overflow:hidden}
.handle{align-self:center;flex:none;width:40px;height:5px;margin-top:12px;border-radius:3px;background:var(--line)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 20px 4px}
.sheet-title{margin:0;font:800 24px/30px var(--font-display);color:var(--ink)}
.scroll{flex:1;min-height:0;overflow:hidden;padding:0 4px;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}

/* Seções por local: o cabeçalho de corredor da ShoppingList, com a contagem. */
.place-head{padding-top:16px}
/* A lista é a StockStepper (linha, medidor e editor), sem o cartão: a folha já é a superfície. */
.sheet .bipa-shelf{padding:0;border-radius:0;background:none}
.sheet .bipa-shelf__row{background:none}
.sheet .bipa-shelf__editor{background:none}
.sheet .bipa-shelf__editor > div{display:grid;justify-content:stretch;gap:12px}
/* Variante nova: os chips do FilterChips como escolha de local, sobre a folha clara. */
.place-pick{margin:0 -16px;padding:2px 16px}
.place-pick button{background:var(--surface-sunken)}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px}
.target-label{font:700 14px/18px var(--font-body);color:var(--ink)}

.foot{flex:none;padding:12px 16px 28px;background:var(--surface)}
.foot .bipa-btn{width:100%;height:56px;font-size:16px}
</style>
</helmet>
<div class="screen bipa-root" style="background: var(--camera);">
  <div class="cam" aria-hidden="true"><div class="shelf"><div><i style="width: 110px"></i><i style="width: 90px"></i><i style="width: 140px"></i><i style="width: 80px"></i></div><hr><div><i style="width: 140px"></i><i style="width: 100px"></i><i style="width: 120px"></i></div></div></div>
  <div class="topbar">
    <a class="glass-btn" href="Main.dc.html" aria-label="Fechar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <button class="glass-btn" type="button" aria-label="Lanterna"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1.5 6h-5zM9.5 9l1 12h3l1-12"/></svg></button>
  </div>
  <div class="dim"></div>

  <section class="sheet" aria-label="Arrumar o que entrou">
    <span class="handle" aria-hidden="true"></span>
    <div class="sheet-head">
      <h2 class="sheet-title">Arrumar o que entrou</h2>
      <span class="bipa-count" aria-label="7 produtos">7</span>
    </div>

    <div class="scroll">
      <div class="bipa-list__aisle place-head"><span>Despensa</span><span>4</span></div>
      <div class="bipa-shelf">
        <div class="bipa-shelf__item is-open">
          <button class="bipa-shelf__row" type="button" aria-expanded="true">
            <span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v3l2 3v12H6V9l2-3z"/><path d="M6 9h12"/></svg></span>
            <span class="bipa-shelf__name">Leite integral 1&nbsp;L</span>
            <span class="bipa-gauge" style="--p: 100" role="img" aria-label="2 embalagens em casa, ter sempre 2"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">2</span></span>
          </button>
          <div class="bipa-shelf__editor"><div>
            <div class="bipa-filter place-pick" role="radiogroup" aria-label="Onde fica o Leite integral 1 L">
              <button type="button" role="radio" aria-checked="true" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12M4 13h16M4 17h16"/></svg>Despensa</button>
              <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M5 10h14M8 6.5v1M8 13v2"/></svg>Geladeira</button>
              <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 6l2.5-1.5M9.5 19.5L12 18l2.5 1.5"/></svg>Freezer</button>
              <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM6 12V6a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2"/></svg>Banheiro</button>
              <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8 6.5h.01"/></svg>Limpeza</button>
            </div>
            <div class="target">
              <span class="target-label" aria-hidden="true">Ter sempre</span>
              <div class="bipa-stepper">
                <button type="button" data-step="-1" aria-label="Ter sempre menos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h12"/></svg></button>
                <span class="bipa-stepper__count" aria-label="ter sempre 2 embalagens"><span class="bipa-roll bipa-stepper__qty"><span>2</span></span><span class="bipa-stepper__unit">emb.</span></span>
                <button type="button" data-step="1" aria-label="Ter sempre mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
              </div>
            </div>
          </div></div>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false">
            <span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M8.5 8.5c.6-1.2 2-1.2 2.6 0M13 7.5c.6-1.2 2-1.2 2.6 0"/></svg></span>
            <span class="bipa-shelf__name">Arroz Tio João 5&nbsp;kg</span>
            <span class="bipa-gauge" style="--p: 100" role="img" aria-label="1 embalagem em casa, ter sempre não definido"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">1</span></span>
          </button>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false">
            <span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="2.5"/><path d="M5 7v10c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V7"/></svg></span>
            <span class="bipa-shelf__name">Atum Gomes da Costa 170&nbsp;g</span>
            <span class="bipa-gauge" style="--p: 100" role="img" aria-label="3 embalagens em casa, ter sempre não definido"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">3</span></span>
          </button>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false">
            <span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M8 7.5c.6-1 1.6-1.5 2.6-1.2M13 6.5c.8-.8 2-1 3-.4"/></svg></span>
            <span class="bipa-shelf__name">Feijão carioca Kicaldo 1&nbsp;kg</span>
            <span class="bipa-gauge" style="--p: 100" role="img" aria-label="2 embalagens em casa, ter sempre não definido"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">2</span></span>
          </button>
        </div>
      </div>

      <div class="bipa-list__aisle place-head"><span>Geladeira</span><span>2</span></div>
      <div class="bipa-shelf">
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false">
            <span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1.5 11a1.5 1.5 0 0 1-1.5 1.3H9a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M5 5h14v3H5z"/></svg></span>
            <span class="bipa-shelf__name">Requeijão Catupiry 200&nbsp;g</span>
            <span class="bipa-gauge" style="--p: 100" role="img" aria-label="1 embalagem em casa, ter sempre não definido"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">1</span></span>
          </button>
        </div>
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false">
            <span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1.5 11a1.5 1.5 0 0 1-1.5 1.3H9a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M5 5h14v3H5z"/></svg></span>
            <span class="bipa-shelf__name">Iogurte natural Nestlé 170&nbsp;g</span>
            <span class="bipa-gauge" style="--p: 100" role="img" aria-label="4 embalagens em casa, ter sempre não definido"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">4</span></span>
          </button>
        </div>
      </div>

      <div class="bipa-list__aisle place-head"><span>Freezer</span><span>1</span></div>
      <div class="bipa-shelf">
        <div class="bipa-shelf__item">
          <button class="bipa-shelf__row" type="button" aria-expanded="false">
            <span class="bipa-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="17" height="11" rx="2"/><path d="M3.5 11h17"/></svg></span>
            <span class="bipa-shelf__name">Lasanha Sadia congelada 600&nbsp;g</span>
            <span class="bipa-gauge" style="--p: 100" role="img" aria-label="1 embalagem em casa, ter sempre não definido"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">1</span></span>
          </button>
        </div>
      </div>
    </div>

    <div class="foot">
      <a class="bipa-btn bipa-btn--neutral" href="Main.dc.html"><span>Pronto</span></a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
