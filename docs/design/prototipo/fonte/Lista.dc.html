<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lista de compras</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/bipa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&amp;family=Figtree:wght@400..700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B22}a:hover{color:#B00E28}
.screen{position:relative;width:390px;height:1250px;box-sizing:border-box;overflow:hidden;background:var(--ground)}
.title{margin:0;font:800 28px/34px var(--font-display);letter-spacing:-0.01em;color:var(--ink)}
.eyebrow{font:600 14px/20px var(--font-body);color:var(--ink-muted)}
.section-title{margin:0;font:700 20px/26px var(--font-display);color:var(--ink)}
.round-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface);color:var(--ink)}
.nav-wrap{position:absolute;left:12px;right:12px;bottom:16px;z-index:3}

.content{display:flex;flex-direction:column;gap:24px;padding:24px 16px 130px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section{display:flex;flex-direction:column;gap:8px}
.section-head{display:flex;align-items:center;gap:8px;padding:0 4px}
.count{font:600 13px/18px var(--font-body);color:var(--ink-muted)}
.enter{animation:bipa-fade-up var(--duration-slow) var(--easing-standard) both}

.content{display:flex;flex-direction:column;gap:20px;padding:24px 16px 150px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.add{display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 16px;border-radius:var(--radius-pill);background:var(--surface);color:var(--ink-muted);font:500 16px/22px var(--font-body)}
.add > svg{width:20px;height:20px}
.add span{flex:1}
.add button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:var(--surface-sunken);color:var(--ink)}
.add button svg{width:20px;height:20px}
.quick-row{display:flex;gap:10px;overflow:hidden;margin:0 -16px;padding:0 16px}
.quick-row .bipa-quick__tile{flex:none;width:76px}
/* Quantidade: só quando é mais de 1, em cinza, antes do nome; o preço continua o da unidade, como na etiqueta. */
.qty{color:var(--ink-muted);font-variant-numeric:tabular-nums;font-weight:600}
.aisles{display:grid;gap:8px}
.aisle-card{display:grid;padding:4px 0;border-radius:var(--radius-lg);background:var(--surface)}
.aisle-head{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font:700 13px/18px var(--font-body);color:var(--ink-muted)}
.aisle-head b{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:8px;background:var(--surface-sunken);color:var(--ink);font:800 12px/1 var(--font-display)}
.aisle-head span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}

</style>
</helmet>
<div class="screen bipa-root">
  <div class="content">
    <header class="head">
      <h1 class="title">Lista</h1>
      <a class="bipa-chip" href="Mercados.dc.html" style="text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5v10h16v-10M9.5 19.5v-5h5v5"/></svg>Atacarejo <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
    </header>
    <a class="bipa-listprev" href="Lista.dc.html" aria-label="Lista de compras: 7 itens, cerca de R$ 84,30">
        <div class="bipa-listprev__num"><strong>7<small>itens</small></strong><span>≈ R$ 84,30</span></div>
        <div class="bipa-listprev__thumbs" aria-hidden="true"><i style="--i: 0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M11 3v3"/></svg></i><i style="--i: 1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M8 8V5h8v3"/></svg></i><i style="--i: 2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l1 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7z"/><path d="M7 7h10"/></svg></i><i style="--i: 3">+4</i></div>
        <span class="bipa-listprev__go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Ir às compras</span>
      </a>
    <div class="add" role="button" aria-label="Adicionar item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Adicionar item</span>
      <button type="button" aria-label="Fotografar lista de papel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></button>
      <button type="button" aria-label="Falar o item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    </div>
    <section class="section">
      <div class="bipa-section-head"><h2>De sempre</h2></div>
      <div class="quick-row">
        <button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12a7 5 0 0 1 14 0v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 10v3M12 9v4M15 10v3"/></svg>Pão</button><button class="bipa-quick__tile" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 0 6 5 6 9a6 6 0 0 1-12 0c0-4 2.5-9 6-9z"/></svg>Ovos</button><button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14c4 5 12 5 16-6-2 4-7 6-12 4"/><path d="M19 7l1-2"/></svg>Banana</button><button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="7" width="12" height="13" rx="2"/><path d="M9 7V4h6v3M9 12h6"/></svg>Sabão</button><button class="bipa-quick__tile" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l1 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7z"/><path d="M7 7h10"/></svg>Leite</button>
      </div>
    </section>
    <section class="section">
      <div class="bipa-section-head"><h2>No mercado</h2><span class="bipa-count">7</span></div>
      <div class="aisles">
        <div class="aisle-card"><div class="aisle-head"><b>2</b><span>Hortifrúti</span><span>1/2</span></div><button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Tomate</span><span class="bipa-list__price">≈ 7,90</span></button><button class="bipa-list__item is-done" type="button" aria-pressed="true"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Banana prata</span><span class="bipa-list__price">≈ 5,49</span></button></div>
        <div class="aisle-card"><div class="aisle-head"><b>5</b><span>Mercearia</span><span>0/3</span></div><button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Café Pilão 500 g</span><span class="bipa-list__price">18,99</span></button><button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Arroz Tio João 5 kg</span><span class="bipa-list__price">27,90</span></button><button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Feijão carioca 1 kg</span><span class="bipa-list__price">8,49</span></button></div>
        <div class="aisle-card"><div class="aisle-head"><b>9</b><span>Laticínios</span><span>0/2</span></div><button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name"><span class="qty" aria-label="3 embalagens">3×</span> Leite integral 1 L</span><span class="bipa-list__price">4,79</span></button><button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Ovos brancos 12 un</span><span class="bipa-list__price">11,34</span></button></div>
      </div>
    </section>
