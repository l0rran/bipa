<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Notificação ao vivo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/bipa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&amp;family=Figtree:wght@400..700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B22}a:hover{color:#B00E28}
.screen{position:relative;width:390px;height:420px;box-sizing:border-box;overflow:hidden;background:#131317}
.title{margin:0;font:800 28px/34px var(--font-display);letter-spacing:-0.01em;color:var(--ink)}
.eyebrow{font:600 14px/20px var(--font-body);color:var(--ink-muted)}
.section-title{margin:0;font:700 20px/26px var(--font-display);color:var(--ink)}
.round-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface);color:var(--ink)}
.nav-wrap{position:absolute;left:12px;right:12px;bottom:16px;z-index:3}

.wall{display:flex;flex-direction:column;gap:16px;padding:28px 16px}
.caption{font:600 13px/18px var(--font-body);color:#A9A8B5}
.chip-bar{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.status-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--brand);color:var(--on-brand);font:700 13px/1 var(--font-body)}
.notif{display:grid;gap:12px;padding:16px;border-radius:24px;background:#26262E;color:#F3F2F6}
.notif-top{display:flex;align-items:center;gap:8px;font:600 12px/16px var(--font-body);color:#A9A8B5}
.app-icon{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--brand);color:var(--on-brand)}
.notif-title{font:800 20px/26px var(--font-display);font-variant-numeric:tabular-nums}
.notif-sub{display:flex;align-items:center;gap:6px;font:500 14px/20px var(--font-body);color:#C9C8D2}
.notif-sub b{display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:7px;background:#3A3A44;color:#F3F2F6;font:800 12px/1 var(--font-display)}
.segments{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.segments span{height:8px;border-radius:999px;background:#3A3A44}
.segments span.on{background:var(--brand)}
.notif-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.notif-actions a{display:grid;place-items:center;height:40px;border-radius:999px;background:#3A3A44;color:#F3F2F6;font:700 14px/1 var(--font-body);text-decoration:none}
.notif-actions a:first-child{background:var(--brand);color:var(--on-brand)}

</style>
</helmet>
<div class="screen" style="background: #131317;">
  <div class="wall">
    <div class="chip-bar">
      <span class="caption">Na barra de status</span>
      <span class="status-chip"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg> 4/7</span>
    </div>
    <article class="notif" aria-label="Notificação ao vivo do Bipa">
      <div class="notif-top"><span class="app-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18"/></svg></span>Bipa · Atacarejo Vila Nova · agora</div>
      <div>
        <div class="notif-title">4 de 7 itens · R$ 54,88</div>
        <div class="notif-sub">Próximo <b>9</b> Laticínios: leite, ovos</div>
      </div>
      <div class="segments" aria-label="4 de 7 itens no carrinho"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span><span class=""></span><span class=""></span><span class=""></span></div>
      <div class="notif-actions"><a href="ModoCarrinho.dc.html">Bipar</a><a href="Lista.dc.html">Lista</a><a href="Main.dc.html">Terminei</a></div>
    </article>
    <span class="caption">Notificação ao vivo do Android 16 (Live Updates): aparece na tela de bloqueio e como chip na barra de status enquanto a compra está em andamento.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
