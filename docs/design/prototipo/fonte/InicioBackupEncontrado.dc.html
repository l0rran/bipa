<html lang="pt-BR">
<head>

<body>

<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&amp;family=Figtree:wght@400..700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B22}a:hover{color:#B00E28}
.screen{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--ground)}
.title{margin:0;font:800 28px/34px var(--font-display);letter-spacing:-0.01em;color:var(--ink)}
.round-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:var(--surface);color:var(--ink)}
.nav-wrap{position:absolute;left:12px;right:12px;bottom:16px;z-index:3}
.content{display:flex;flex-direction:column;gap:24px;padding:24px 16px 130px}
.head{display:flex;flex-direction:column;gap:16px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title-row .round-btn{text-decoration:none}
.enter{animation:bipa-fade-up var(--duration-slow) var(--easing-standard) both}
/* Backup encontrado (proposta): o cartão de pergunta do InsightCard, neutro, no lugar do convite da casa vazia.
   Os números do arquivo nos bipa-facts; "Restaurar" no botão neutro, porque é a resposta esperada e não apaga
   nada (a casa está vazia), e "Começar do zero" no secundário, com a mesma largura. Sem ×: a pergunta fica até a resposta. */
.ask .bipa-insight__eyebrow{color:var(--ink-muted)}
.ask .bipa-facts{--facts:3;margin-top:4px}
.ask .bipa-insight__actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-2)}
.ask .bipa-insight__actions .bipa-btn{width:100%;padding:0 12px}
.bipa-root button.bipa-btn{font:700 15px/1 var(--font-body)}
</style>
</helmet>
<div class="screen bipa-root">
  <div class="content">
    <header class="head enter">
      <div class="title-row"><h1 class="title">Sua casa</h1><a class="round-btn" href="AjustesBackup.dc.html" aria-label="Ajustes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a></div>
      <label class="bipa-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input type="search" placeholder="Buscar na sua casa" aria-label="Buscar na sua casa"><button class="bipa-search__scan" type="button" aria-label="Bipar um produto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18"/></svg></button></label>
    </header>

    <div class="enter" style="animation-delay: 40ms;"><article class="bipa-insight ask" aria-labelledby="ask-title">
      <span class="bipa-insight__eyebrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5a4.5 4.5 0 0 1-.7-8.95 6 6 0 0 1 11.5 1.45A3.75 3.75 0 0 1 17.25 18.5z"/></svg>Backup do Google</span>
      <h2 class="bipa-insight__headline" id="ask-title">Restaurar o backup de 12/10?</h2>
      <div class="bipa-facts">
        <div class="bipa-fact"><span class="bipa-fact__value">214</span><span class="bipa-fact__label">produtos</span></div>
        <div class="bipa-fact"><span class="bipa-fact__value">1.380</span><span class="bipa-fact__label">preços</span></div>
        <div class="bipa-fact"><span class="bipa-fact__value">56</span><span class="bipa-fact__label">itens em casa</span></div>
      </div>
      <div class="bipa-insight__actions"><button class="bipa-btn bipa-btn--neutral" type="button"><span>Restaurar</span></button><button class="bipa-btn bipa-btn--secondary" type="button"><span>Começar do zero</span></button></div>
    </article></div>
  </div>

: none;"><span class="bipa-nav__icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1"/><circle cx="4.8" cy="12" r="1"/><circle cx="4.8" cy="17.5" r="1"/></svg></span><span class="bipa-nav__label">Lista</span></a></nav></div>
</div>
