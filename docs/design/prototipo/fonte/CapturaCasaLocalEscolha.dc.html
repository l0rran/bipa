<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Guardar em casa: escolher o local</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/bipa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&amp;family=Figtree:wght@400..700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1B22}a:hover{color:#B00E28}
.screen{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:var(--camera)}
.cam{position:absolute;inset:0;background:var(--camera);overflow:hidden}
.shelf{position:absolute;left:-10px;right:-10px;top:150px;display:grid;grid-template-rows:150px 10px 150px;gap:16px;opacity:.55}
.shelf div{display:flex;gap:10px}
.shelf i{display:block;flex:none;border-radius:14px;background:#2B2B33}
.shelf hr{margin:0;border:0;background:#35353F}
.topbar{position:absolute;left:16px;right:16px;top:20px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}
.glass-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:rgba(14,14,18,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--on-camera);text-decoration:none}
.frame-wrap{position:absolute;left:0;right:0;top:0;bottom:0}
/* A embalagem com o código dentro da moldura (fora do design system: é a imagem da câmera). */
.pack{position:absolute;left:118px;top:176px;width:154px;height:170px;border-radius:10px;background:#E9E6DF;box-shadow:0 10px 30px rgba(0,0,0,.45);transform:rotate(2deg)}
.pack::before{content:"";position:absolute;left:0;right:0;top:0;height:54px;border-radius:10px 10px 0 0;background:#3E6FB4}
.pack i{position:absolute;left:34px;right:34px;bottom:26px;height:46px;background:repeating-linear-gradient(90deg,#1C1B1F 0 2px,transparent 2px 4px,#1C1B1F 4px 5px,transparent 5px 8px)}
.below{position:absolute;left:16px;right:16px;top:364px;display:grid;justify-items:center;gap:10px;z-index:3}
/* O aviso do visor (LiveReadChip no app): ícone, o número em destaque, o texto e a ação.
   Com o item novo, o texto diz o local e é um botão com a seta para baixo (abre a escolha),
   e o Desfazer é outro botão no mesmo aviso: um sinal só, sem chip separado (AB9). */
.read-chip{max-width:100%;box-sizing:border-box;border:0;padding:0;gap:0}
.read-chip b{font:800 16px/20px var(--font-display);font-variant-numeric:tabular-nums}
.read-chip .bipa-chip__meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.read-chip button{display:inline-flex;align-items:center;min-width:0;height:48px;margin:-4px 0;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.read-chip .place{gap:var(--space-2);padding-left:var(--space-3);padding-right:4px}
.read-chip .place .down{width:16px;height:16px;margin-left:-6px}
.read-chip .act{padding:0 var(--space-4) 0 var(--space-2);font:700 14px/18px var(--font-body);color:var(--on-camera)}
.hint{font:700 14px/18px var(--font-body);color:var(--on-camera);text-align:center}

.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:4}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;gap:16px;padding:12px 16px 32px;border-radius:28px 28px 0 0;background:var(--surface);box-shadow:var(--shadow-float);animation:bipa-in-up var(--duration-slow) var(--easing-spring) both}
.handle{justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet-title{margin:4px 4px 0;font:800 22px/28px var(--font-display);color:var(--ink)}
/* FilterChips como escolha (a mesma variante de "Arrumar o que entrou"), quebrando a linha. */
.place-pick{flex-wrap:wrap;overflow:visible;row-gap:8px}
.place-pick button{height:44px;padding:0 16px;background:var(--surface-sunken);font-size:15px}
.place-pick button svg{width:18px;height:18px}
</style>
</helmet>
<div class="screen bipa-root" style="background: var(--camera);">
  <div class="cam" aria-hidden="true"><div class="shelf"><div><i style="width: 110px"></i><i style="width: 90px"></i><i style="width: 140px"></i><i style="width: 80px"></i></div><hr><div><i style="width: 140px"></i><i style="width: 100px"></i><i style="width: 120px"></i></div></div></div>
  <div class="pack" aria-hidden="true"><i></i></div>
  <div class="frame-wrap"><div class="bipa-frame" style="left: 84px; top: 196px; width: 222px; height: 124px; transform: scale(.94);"><span class="bipa-frame__corner bipa-frame__corner--tl"></span><span class="bipa-frame__corner bipa-frame__corner--tr"></span><span class="bipa-frame__corner bipa-frame__corner--bl"></span><span class="bipa-frame__corner bipa-frame__corner--br"></span></div></div>
  <div class="topbar">
    <a class="glass-btn" href="Main.dc.html" aria-label="Fechar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <button class="glass-btn" type="button" aria-label="Lanterna"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1.5 6h-5zM9.5 9l1 12h3l1-12"/></svg></button>
  </div>
  <div class="below">
    <div class="bipa-chip bipa-chip--glass read-chip" role="status"><button class="place" type="button" aria-label="+1, Leite integral 1 L · 1 na Despensa, trocar o local"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><b>+1</b><span class="bipa-chip__meta">Leite integral 1&nbsp;L · 1 na Despensa</span><svg class="down" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><button class="act" type="button">Desfazer</button></div>
  </div>
  <div class="dim" aria-hidden="true"></div>
  <section class="sheet" aria-labelledby="local-titulo">
    <span class="handle" aria-hidden="true"></span>
    <h2 class="sheet-title" id="local-titulo">Onde fica Leite integral 1&nbsp;L?</h2>
    <div class="bipa-filter place-pick" role="radiogroup" aria-labelledby="local-titulo">
      <button type="button" role="radio" aria-checked="true" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Despensa</button>
      <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M5 10h14M8 6.5v1M8 13v2"/></svg>Geladeira</button>
      <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5L12 6l2.5-1.5M9.5 19.5L12 18l2.5 1.5"/></svg>Freezer</button>
      <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM6 12V6a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2"/></svg>Banheiro</button>
      <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8 6.5h.01"/></svg>Limpeza</button>
      <button type="button" role="radio" aria-checked="false" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M4 11h16M9 4h6l1 3H8z"/></svg>Outros</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
