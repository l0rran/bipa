<!-- @dsCard group="Lugar" height=130 subtitle="Entrada em cascata e pulso de 'você está aqui'" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-2); padding: var(--space-6) var(--space-4); }
</style>
</head>
<body>
  <div class="bipa-root row" id="chips">
    <button class="bipa-chip bipa-chip--here" type="button">
      <span class="bipa-ping" aria-hidden="true"></span>
      Atacarejo Vila Nova <span class="bipa-chip__meta">você está aqui</span>
    </button>
    <button class="bipa-chip" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5v10h16v-10M9.5 19.5v-5h5v5"/></svg>
      Mercado do Bairro <span class="bipa-chip__meta">850 m</span>
    </button>
    <button class="bipa-chip" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5L5.5 4h13L20 9.5M4 9.5h16M4 9.5v10h16v-10M9.5 19.5v-5h5v5"/></svg>
      Hortifruti da Praça
    </button>
  </div>
  <script>
    window.Bipa.MarketChip.enhance(document.getElementById('chips'));
  </script>
</body>
</html>
