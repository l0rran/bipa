<!-- @dsCard group="Estoque" height=300 subtitle="Prateleira de Acabando: imagem, medidor no canto e + para pôr na lista; role para o lado" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: grid; gap: var(--space-6); padding: var(--space-6) var(--space-4); max-width: 420px; }
  .section { display: grid; gap: var(--space-3); }
  .section-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .section-head h2 { margin: 0; font: 700 20px/26px var(--font-display); color: var(--ink); }
  .count { font: 600 13px/18px var(--font-body); color: var(--ink-muted); }
  .log { min-height: 20px; padding: 0 4px; font: 600 13px/20px var(--font-body); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="bipa-root stage" style="overflow: hidden;">
    <section class="section">
      <div class="section-head"><h2>Acabando</h2><span class="bipa-count bipa-count--alert">4</span></div>
      <div class="bipa-cards">
      <article class="bipa-pcard is-out" data-place="pantry">
        <div class="bipa-pcard__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M8 8V5h8v3"/></svg><span class="bipa-gauge is-low is-out" style="--p: 0" role="img" aria-label="Acabou"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">0</span></span>
          <button class="bipa-pcard__add" type="button" aria-pressed="true" aria-label="Tirar da lista"><span class="is-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button>
        </div>
        <span class="bipa-pcard__name">Arroz Tio João 5 kg</span>
      </article>
      <article class="bipa-pcard" data-place="fridge">
        <div class="bipa-pcard__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l1 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7z"/><path d="M7 7h10"/></svg><span class="bipa-gauge is-low" style="--p: 50" role="img" aria-label="2 de 4 un"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">2</span></span>
          <button class="bipa-pcard__add" type="button" aria-pressed="false" aria-label="Pôr na lista"><span class="is-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button>
        </div>
        <span class="bipa-pcard__name">Leite integral 1 L</span>
      </article>
      <article class="bipa-pcard" data-place="bath">
        <div class="bipa-pcard__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="9" cy="12" r="1.5"/><path d="M9 7h9v10H9"/></svg><span class="bipa-gauge is-low" style="--p: 25" role="img" aria-label="1 de 4 rolos"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">1</span></span>
          <button class="bipa-pcard__add" type="button" aria-pressed="false" aria-label="Pôr na lista"><span class="is-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button>
        </div>
        <span class="bipa-pcard__name">Papel higiênico Neve</span>
      </article>
      <article class="bipa-pcard" data-place="fridge">
        <div class="bipa-pcard__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 0 6 5 6 9a6 6 0 0 1-12 0c0-4 2.5-9 6-9z"/></svg><span class="bipa-gauge is-low" style="--p: 33" role="img" aria-label="4 de 12 un"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">4</span></span>
          <button class="bipa-pcard__add" type="button" aria-pressed="false" aria-label="Pôr na lista"><span class="is-off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button>
        </div>
        <span class="bipa-pcard__name">Ovos brancos 12 un</span>
      </article>
      </div>
    </section>
    <div class="log" id="log" aria-live="polite"></div>
  </div>
  <script>
    document.querySelectorAll('.bipa-pcard').forEach(function (card) {
      window.Bipa.ProductCard.enhance(card);
      card.addEventListener('bipa:list', function (e) {
        document.getElementById('log').textContent = (e.detail.onList ? 'Na lista: ' : 'Fora da lista: ') + card.querySelector('.bipa-pcard__name').textContent;
      });
    });
  </script>
</body>
</html>
