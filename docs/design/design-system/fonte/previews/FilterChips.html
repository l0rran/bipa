<!-- @dsCard group="Estoque" height=380 subtitle="Locais como categorias (Casa) ou como chips (listas longas), e os estados do medidor de nível" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: grid; gap: var(--space-6); padding: var(--space-6) var(--space-4); max-width: 420px; }
  .section { display: grid; gap: var(--space-3); }
  .section-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .section-head h2 { margin: 0; font: 700 20px/26px var(--font-display); color: var(--ink); }
  .count { font: 600 13px/18px var(--font-body); color: var(--ink-muted); }
  .log { min-height: 20px; padding: 0 4px; font: 600 13px/20px var(--font-body); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="bipa-root stage">
    <div class="section"><div class="bipa-filter bipa-filter--tiles" role="group" aria-label="Filtrar por local"><button type="button" data-value="all" aria-pressed="true"><span class="bipa-filter__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><small>24</small></span>Tudo</button><button type="button" data-value="pantry" aria-pressed="false"><span class="bipa-filter__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12M4 13h16M4 17h16"/></svg><small>12</small></span>Despensa</button><button type="button" data-value="fridge" aria-pressed="false"><span class="bipa-filter__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M5 10h14M8 6.5v1M8 13v2"/></svg><small>6</small></span>Geladeira</button><button type="button" data-value="bath" aria-pressed="false"><span class="bipa-filter__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM6 12V6a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2"/></svg><small>3</small></span>Banheiro</button><button type="button" data-value="laundry" aria-pressed="false"><span class="bipa-filter__art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8 6.5h.01"/></svg><small>3</small></span>Limpeza</button></div></div>
    <div class="section"><div class="bipa-filter" role="group" aria-label="Filtrar por local"><button type="button" data-value="all" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Tudo <small>24</small></button><button type="button" data-value="pantry" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12M4 13h16M4 17h16"/></svg>Despensa <small>12</small></button><button type="button" data-value="fridge" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M5 10h14M8 6.5v1M8 13v2"/></svg>Geladeira <small>6</small></button><button type="button" data-value="bath" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16v2a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM6 12V6a2 2 0 0 1 4 0M7 19l-1 2M17 19l1 2"/></svg>Banheiro <small>3</small></button><button type="button" data-value="laundry" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8 6.5h.01"/></svg>Limpeza <small>3</small></button></div></div>
    <style>.demos { display: flex; flex-wrap: wrap; gap: 24px; } .demo { min-width: 56px; display: grid; justify-items: center; gap: 6px; font: 600 12px/16px var(--font-body); color: var(--ink-muted); }</style>
    <div class="demos"><div class="demo"><span class="bipa-gauge" style="--p: 100" role="img" aria-label="Em dia"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">3</span></span><span>Em dia</span></div><div class="demo"><span class="bipa-gauge is-low" style="--p: 50" role="img" aria-label="2 de 4"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">2</span></span><span>2 de 4</span></div><div class="demo"><span class="bipa-gauge is-low" style="--p: 25" role="img" aria-label="1 de 4"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">1</span></span><span>1 de 4</span></div><div class="demo"><span class="bipa-gauge is-low is-out" style="--p: 0" role="img" aria-label="Acabou"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bipa-gauge__track" cx="20" cy="20" r="17" pathLength="100"/><circle class="bipa-gauge__fill" cx="20" cy="20" r="17" pathLength="100"/></svg><span class="bipa-gauge__value">0</span></span><span>Acabou</span></div></div>
    <div class="log" id="log" aria-live="polite"></div>
  </div>
  <script>
    document.querySelectorAll('.bipa-filter').forEach(function (group) {
      window.Bipa.FilterChips.enhance(group);
      group.addEventListener('bipa:filter', function (e) { document.getElementById('log').textContent = 'Filtro: ' + e.detail.value; });
    });
  </script>
</body>
</html>
