<!-- @dsCard group="Preço" height=300 subtitle="Normal, de/por, preço no app (clube) e leve 3 pague 2; o preço conta ao aparecer" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-6) var(--space-4); padding: var(--space-6) var(--space-4) var(--space-4); align-items: flex-end; }
  .item { display: grid; gap: var(--space-2); justify-items: start; }
  .replay { margin: 0 var(--space-4); height: 36px; padding: 0 14px; border: 0; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--ink); font: 700 13px/1 var(--font-body); cursor: pointer; }
</style>
</head>
<body>
  <div class="bipa-root">
    <div class="row">
      <div class="item">
        <div class="bipa-tag bipa-tag--hero">
          <span class="bipa-tag__value"><small>R$</small><span data-cents="799">7,99</span></span>
          <span class="bipa-tag__unit">R$ 20,23/kg · 395 g</span>
        </div>
        <span class="bipa-badge bipa-badge--save">Mais barato aqui · −R$ 1,20</span>
      </div>
      <div class="item">
        <div class="bipa-tag">
          <span class="bipa-tag__was">de R$ 32,90</span>
          <span class="bipa-tag__value"><small>R$</small><span data-cents="2490">24,90</span></span>
          <span class="bipa-tag__unit">R$ 15,56/kg</span>
        </div>
      </div>
      <div class="item">
        <div class="bipa-tag">
          <span class="bipa-tag__flag">No app</span>
          <span class="bipa-tag__value"><small>R$</small><span data-cents="1699">16,99</span></span>
          <span class="bipa-tag__alt">sem app <b>R$ 18,99</b></span>
        </div>
      </div>
      <div class="item">
        <div class="bipa-tag">
          <span class="bipa-tag__flag">Leve 3 pague 2</span>
          <span class="bipa-tag__value"><small>R$</small><span data-cents="533">5,33</span></span>
          <span class="bipa-tag__alt">cada, levando 3 · un. <b>R$ 7,99</b></span>
        </div>
      </div>
    </div>
    <button class="replay" type="button" id="replay">Repetir animação</button>
  </div>
  <script>
    var tags = document.querySelectorAll('.bipa-tag');
    var play = function () { tags.forEach(function (tag) { window.Bipa.PriceTag.play(tag); }); };
    document.getElementById('replay').addEventListener('click', play);
    play();
  </script>
</body>
</html>
