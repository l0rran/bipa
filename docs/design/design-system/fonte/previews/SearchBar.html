<!-- @dsCard group="Casa" height=160 subtitle="Busca no topo da Casa, com o botão de bipar dentro" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: grid; gap: var(--space-6); padding: var(--space-6) var(--space-4); max-width: 420px; }
  .section { display: grid; gap: var(--space-3); }
  .section-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .section-head h2 { margin: 0; font: 700 20px/26px var(--font-display); color: var(--ink); }
  .count { font: 600 13px/18px var(--font-body); color: var(--ink-muted); }
  .log { min-height: 20px; padding: 0 4px; font: 600 13px/20px var(--font-body); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="bipa-root stage" style="gap: var(--space-3);">
    <label class="bipa-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input type="search" placeholder="Buscar na sua casa" aria-label="Buscar na sua casa"><button class="bipa-search__scan" type="button" aria-label="Bipar um produto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18"/></svg></button></label>
    <div class="log" id="log" aria-live="polite"></div>
  </div>
  <script>
    var bar = document.querySelector('.bipa-search');
    window.Bipa.SearchBar.enhance(bar);
    bar.addEventListener('bipa:scan', function () { document.getElementById('log').textContent = 'Abrir a câmera para bipar'; });
  </script>
</body>
</html>
