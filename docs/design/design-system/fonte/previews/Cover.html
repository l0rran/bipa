<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Figtree:wght@500&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--ground); }
  svg { position: absolute; inset: 0; }
  .red { fill: var(--brand); }
  .yellow { fill: var(--ink); }
  .slate { fill: var(--surface-sunken); }
  .amber { fill: var(--alert); }
  .laser { fill: var(--alert); }
  .ink { fill: var(--ink); }
  .hole { fill: var(--ground); }
  .slab { rx: var(--radius-lg); }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { margin: 0; font: 800 120px/0.92 var(--font-display); letter-spacing: -0.04em; color: var(--ink); }
  .tagline { margin: 12px 0 0; font: 500 14px/20px var(--font-body); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="cover">
    <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
      <!--
        blocos: brand (slab amarelo 208×248, radius-lg), ink (etiqueta 224×96 com furo), surface-sunken (pílula 96×176), alert (disco 64), ink (pílula 160×48)
        arranjo: um slab amarelo alto que sangra pelo topo, a etiqueta escura ao lado e satélites menores; a pílula clara sangra por baixo
        padrão: o símbolo ampliado no slab (quatro barras em ink e o laser coral) e a silhueta de etiqueta com o furo do preço
        escalas: passos space-4 (16) e space-8 (32); raios radius-lg (20) nos slabs e meia altura nas pílulas
      -->
      <rect class="red slab" x="496" y="-20" width="208" height="248"/>
      <g style="fill: var(--ink)">
        <rect x="544" y="48" width="16" height="128" rx="8"/>
        <rect x="576" y="48" width="32" height="128" rx="8"/>
        <rect x="624" y="48" width="12" height="128" rx="6"/>
        <rect x="652" y="48" width="24" height="128" rx="8"/>
      </g>
      <rect class="laser" x="520" y="106" width="168" height="12" rx="6"/>
      <rect class="yellow slab" x="720" y="32" width="224" height="96"/>
      <circle class="hole" cx="752" cy="80" r="10"/>
      <rect class="slate" x="848" y="144" width="96" height="176" rx="48"/>
      <circle class="amber" cx="784" cy="208" r="32"/>
      <rect class="ink" x="512" y="248" width="160" height="48" rx="24"/>
    </svg>
    <div class="text">
      <h1 class="name">Bipa</h1>
      <p class="tagline">Bipou, salvou. Preços e estoque da casa sem digitar.</p>
    </div>
  </div>
</body>
</html>
