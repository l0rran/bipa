<!-- @dsCard group="Início" height=200 subtitle="Durante a compra, fixa acima da navegação em todas as abas; toque em Bipar item para ver o progresso" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600..800&family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: grid; gap: var(--space-6); padding: var(--space-6) var(--space-4); max-width: 420px; }
  .section { display: grid; gap: var(--space-3); }
  .section-head { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  .section-head h2 { margin: 0; font: 700 20px/26px var(--font-display); color: var(--ink); }
  .count { font: 600 13px/18px var(--font-body); color: var(--ink-muted); }
  .log { min-height: 20px; padding: 0 4px; font: 600 13px/20px var(--font-body); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="bipa-root stage" style="gap: var(--space-4);">
    <a class="bipa-cartbar" href="ModoCarrinho.dc.html" aria-label="Compra em andamento: 3 de 7 itens, R$ 32,10">
      <span class="bipa-cartbar__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg></span>
      <span class="bipa-cartbar__text"><strong>3 de 7 itens</strong><span>R$ <span data-cents="3210">32,10</span> · Atacarejo Vila Nova</span></span>
      <span class="bipa-cartbar__go">Continuar <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
      <span class="bipa-cartbar__progress" style="--p: 43" aria-hidden="true"><i></i></span>
    </a>
    <button class="bipa-btn bipa-btn--secondary" type="button" id="bip" style="justify-self: start;"><span>Bipar item</span></button>
  </div>
  <script>
    var bar = document.querySelector('.bipa-cartbar');
    bar.addEventListener('click', function (e) { e.preventDefault(); });
    var api = window.Bipa.ShoppingBar.enhance(bar);
    var done = 3, cents = 3210;
    document.getElementById('bip').addEventListener('click', function () {
      if (done >= 7) { done = 0; cents = 0; }
      done += 1; cents += 799;
      api.update({ done: done, total: 7, cents: cents });
    });
  </script>
</body>
</html>
