  <script>
    var log = document.getElementById('log');
    document.querySelectorAll('.bipa-filter').forEach(function (group) { window.Bipa.FilterChips.enhance(group); });
    document.querySelectorAll('.bipa-shelf').forEach(function (shelf) {
      window.Bipa.StockStepper.enhance(shelf);
      shelf.querySelectorAll('.bipa-shelf__item').forEach(function (item) {
        window.Bipa.SwipeRow.enhance(item);
        var name = item.querySelector('.bipa-shelf__name').textContent;
        item.addEventListener('bipa:swipe', function (e) { log.textContent = (e.detail.action === 'used' ? 'Usei um: ' : 'Na lista: ') + name; });
      });
    });
  </script>
