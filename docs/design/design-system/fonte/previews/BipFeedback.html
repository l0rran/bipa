<!-- @dsCard group="Feedback" height=260 subtitle="O 'Bipou!' depois de salvar um preço, com Desfazer e o tempo para desfazer; toque para repetir" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: grid; justify-items: center; gap: var(--space-4); padding: var(--space-6) var(--space-4); }
  .replay { height: 36px; padding: 0 14px; border: 0; border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--ink); font: 700 13px/1 var(--font-body); cursor: pointer; }
</style>
</head>
<body>
  <div class="bipa-root stage">
    <div class="bipa-bip" id="bip" role="status">
      <div class="bipa-bip__mark" aria-hidden="true">
        <span class="bipa-bip__ring"></span>
        <span class="bipa-bip__ripple"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="bipa-toast"><strong>Bipou!</strong> R$ 7,99 no Atacarejo<button class="bipa-toast__undo" type="button">Desfazer</button><span class="bipa-toast__timer" aria-hidden="true"></span></div>
    </div>
    <button class="replay" type="button" id="replay">Repetir animação</button>
  </div>
  <script>
    var bip = document.getElementById('bip');
    document.getElementById('replay').addEventListener('click', function () { window.Bipa.BipFeedback.play(bip); });
    window.Bipa.BipFeedback.play(bip);
  </script>
</body>
</html>
