<!-- @dsCard group="Navegação" height=440 width=420 subtitle="Role a lista: a barra de vidro encolhe. Segure o botão de bipar: abre o menu" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .phone { position: relative; height: 420px; margin: 10px; overflow: hidden; border-radius: var(--radius-lg); background: var(--ground); }
  .scroller { position: absolute; inset: 0; overflow-y: auto; padding: 16px 12px 130px; display: grid; gap: 8px; align-content: start; }
  .fake { display: grid; gap: 8px; padding: 16px; border-radius: var(--radius-lg); background: var(--surface); }
  .fake b { display: block; height: 12px; border-radius: 6px; background: var(--ink); opacity: 0.85; }
  .fake i { display: block; height: 10px; border-radius: 5px; background: var(--ink-muted); opacity: 0.5; }
  .fake:nth-child(3n) { background: var(--brand-soft); }
  .fake:nth-child(4n) { background: var(--alert-soft); }
  .bar-wrap { position: absolute; left: 12px; right: 12px; bottom: 14px; z-index: 3; }
</style>
</head>
<body>
  <div class="bipa-root phone">
    <div class="scroller" id="scroller"><div class="fake"><b style="width:62%"></b><i style="width:30%"></i></div><div class="fake"><b style="width:48%"></b><i style="width:36%"></i></div><div class="fake"><b style="width:70%"></b><i style="width:24%"></i></div><div class="fake"><b style="width:55%"></b><i style="width:40%"></i></div><div class="fake"><b style="width:66%"></b><i style="width:28%"></i></div><div class="fake"><b style="width:44%"></b><i style="width:33%"></i></div><div class="fake"><b style="width:58%"></b><i style="width:26%"></i></div><div class="fake"><b style="width:64%"></b><i style="width:38%"></i></div></div>
    <div class="bipa-menu-scrim" id="scrim"></div>
    <div class="bar-wrap">
      <nav class="bipa-nav bipa-nav--glass" aria-label="Navegação principal" id="nav">
        <span class="bipa-nav__indicator" aria-hidden="true"></span>
        <button class="bipa-nav__dest" type="button" aria-current="page"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5v8.5H4z"/><path d="M10 19.5v-5h4v5"/></svg></span><span class="bipa-nav__label">Início</span></button>
        <button class="bipa-nav__dest" type="button"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 3.5H20v7.4L11 20 3.9 12.9z"/><circle cx="16" cy="7.8" r="1.4"/></svg></span><span class="bipa-nav__label">Produtos</span></button>
        <button class="bipa-scan" type="button" aria-haspopup="menu">
          <span class="bipa-scan__icon">
            <svg class="bipa-scan__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M3 12h18"/></svg>
            <svg class="bipa-scan__close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </span>
        </button>
        <button class="bipa-nav__dest" type="button"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span><span class="bipa-nav__label">Mercados</span></button>
        <button class="bipa-nav__dest" type="button"><span class="bipa-nav__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1"/><circle cx="4.8" cy="12" r="1"/><circle cx="4.8" cy="17.5" r="1"/></svg></span><span class="bipa-nav__label">Lista</span></button>
        <div class="bipa-scan-menu" role="menu">
          <button class="bipa-scan-menu__item" type="button" role="menuitem" data-action="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Modo carrinho<small>vários seguidos</small></button>
          <button class="bipa-scan-menu__item" type="button" role="menuitem" data-action="consume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5v8.5H4z"/><path d="M9 14h6"/></svg>Dar baixa em casa</button>
          <button class="bipa-scan-menu__item" type="button" role="menuitem" data-action="receipt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Ler cupom fiscal</button>
        </div>
      </nav>
    </div>
  </div>
  <script>
    window.Bipa.ScanNavBar.enhance(document.getElementById('nav'), {
      scroller: document.getElementById('scroller'),
      scrim: document.getElementById('scrim')
    });
  </script>
</body>
</html>
