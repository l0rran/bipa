<!-- @dsCard group="Lista" height=640 subtitle="Adicionar com um toque e lista na ordem dos corredores do mercado" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700..800&family=Figtree:wght@400..700&display=swap">
<style>
  body { margin: 0; background: var(--ground); }
  .stage { display: grid; gap: var(--space-4); padding: var(--space-4); max-width: 420px; }
  .label { font: 700 12px/16px var(--font-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
  .group { display: grid; }
</style>
</head>
<body>
  <div class="bipa-root stage" id="root">
    <span class="label">Comprados com frequência</span>
    <div class="bipa-quick">
      <button class="bipa-quick__tile" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l1 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7z"/><path d="M7 7h10"/></svg>Leite</button>
      <button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12a7 5 0 0 1 14 0v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 10v3M12 9v4M15 10v3"/></svg>Pão</button>
      <button class="bipa-quick__tile" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M11 3v3"/></svg>Café</button>
      <button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 0 6 5 6 9a6 6 0 0 1-12 0c0-4 2.5-9 6-9z"/></svg>Ovos</button>
      <button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14c4 5 12 5 16-6-2 4-7 6-12 4"/><path d="M19 7l1-2"/></svg>Banana</button>
      <button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7z"/><path d="M8 8V5h8v3"/></svg>Arroz</button>
      <button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="7" width="12" height="13" rx="2"/><path d="M9 7V4h6v3M9 12h6"/></svg>Sabão</button>
      <button class="bipa-quick__tile" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="9" cy="12" r="1.5"/><path d="M9 7h9v10H9"/></svg>Papel hig.</button>
    </div>

    <div class="bipa-progress">
      <div class="bipa-progress__label"><span>Atacarejo Vila Nova · na ordem dos corredores</span><strong><span class="bipa-roll bipa-progress__done"><span>1</span></span> de 6</strong></div>
      <div class="bipa-progress__bar"><div class="bipa-progress__fill" style="transform: scaleX(0)"></div></div>
    </div>

    <div class="bipa-list">
      <div class="bipa-list__aisle"><span>Corredor 2 · Hortifrúti</span></div>
      <div class="group">
        <button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Banana prata</span><span class="bipa-list__price">~R$ 5,49</span></button>
        <button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Tomate</span><span class="bipa-list__price">~R$ 7,90</span></button>
      </div>
      <div class="bipa-list__aisle"><span>Corredor 5 · Mercearia</span></div>
      <div class="group">
        <button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Café Pilão 500 g</span><span class="bipa-list__price">R$ 18,99</span></button>
        <button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Arroz Tio João 5 kg</span><span class="bipa-list__price">R$ 27,90</span></button>
        <button class="bipa-list__item is-done" type="button" aria-pressed="true"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Leite condensado</span><span class="bipa-list__price">R$ 7,99</span></button>
      </div>
      <div class="bipa-list__aisle"><span>Corredor 9 · Laticínios</span></div>
      <div class="group">
        <button class="bipa-list__item" type="button" aria-pressed="false"><span class="bipa-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="bipa-list__name">Leite integral 1 L</span><span class="bipa-list__price">R$ 4,79</span></button>
      </div>
    </div>
  </div>
  <script>
    window.Bipa.ShoppingList.enhance(document.getElementById('root'));
  </script>
</body>
</html>
